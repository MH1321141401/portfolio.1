<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meahearab Hossain | Aspiring AI Engineer &amp; Programmer</title>
<meta name="description" content="Portfolio of Meahearab Hossain, a student and aspiring AI Engineer learning Python, web development and AI tools at Navians' Science Club IT Department.">
<meta name="theme-color" content="#040806">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#040806;--s:#09120d;--b:rgba(43,255,136,.17);--g:#2BFF88;--g2:#19C463;--t:#EAF2EE;--m:#8B9C93;--p:#7c3aed;
--disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"Inter",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--nav:72px}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:var(--nav)}
body{margin:0;background:var(--bg);color:var(--t);font:400 1rem/1.65 var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased;
background-image:radial-gradient(50% 40% at 0% 0%,rgba(43,255,136,.08),transparent),radial-gradient(45% 35% at 100% 30%,rgba(124,58,237,.12),transparent)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(43,255,136,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(43,255,136,.035) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:linear-gradient(#000,transparent 85%);mask-image:linear-gradient(#000,transparent 85%)}
h1,h2,h3,p,ul{margin:0}ul{list-style:none;padding:0}a{color:inherit;text-decoration:none}
button,a{touch-action:manipulation}
:focus-visible{outline:2px solid var(--g);outline-offset:3px;border-radius:8px}
.wrap{width:min(1200px,100% - 2.5rem);margin-inline:auto}
.ic{width:1.35rem;height:1.35rem;fill:none;stroke:var(--g);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--mono)}

/* ===== PHANTOM ACCESS INTRO ===== */
.ph-overlay{display:none;position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100vh;height:100dvh;z-index:999;
align-items:center;justify-content:center;
padding:max(1rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) max(1rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left));
background:#030705;overscroll-behavior:contain;
background-image:radial-gradient(60% 45% at 15% 15%,rgba(43,255,136,.12),transparent),radial-gradient(55% 45% at 85% 85%,rgba(124,58,237,.18),transparent);
transition:opacity .55s cubic-bezier(.22,1,.36,1),transform .55s cubic-bezier(.22,1,.36,1);will-change:opacity,transform}
.ph-overlay::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background-image:linear-gradient(rgba(43,255,136,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(43,255,136,.035) 1px,transparent 1px);background-size:42px 42px}
html.phantom-on body{overflow:hidden}
html.phantom-on .ph-overlay{display:flex}
html.phantom-exit .ph-overlay{opacity:0;transform:scale(1.02);pointer-events:none}

.ph-term{position:relative;z-index:2;width:min(680px,100%);max-height:calc(100vh - 2rem);max-height:calc(100dvh - 2rem);
overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
border:1px solid rgba(43,255,136,.32);border-radius:16px;background:#070f0b;
box-shadow:0 24px 70px rgba(0,0,0,.8),0 0 40px rgba(43,255,136,.14),0 0 55px rgba(124,58,237,.16)}

.ph-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.8rem 1.1rem;border-bottom:1px solid rgba(43,255,136,.18);background:#040906}
.ph-hl{display:flex;align-items:center;gap:.65rem;min-width:0}
.ph-dots{display:flex;gap:.38rem;flex:none}
.ph-dots i{width:10px;height:10px;border-radius:50%;display:block}
.ph-dots i:nth-child(1){background:#ff5f57}.ph-dots i:nth-child(2){background:#febc2e}.ph-dots i:nth-child(3){background:#28c840}
.ph-title{font:600 .8rem var(--mono);letter-spacing:.08em;color:var(--g);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-badge{font:500 .68rem var(--mono);color:#c4b5fd;border:1px solid rgba(124,58,237,.45);background:rgba(124,58,237,.14);padding:.15rem .55rem;border-radius:999px;flex:none}
.ph-skip{appearance:none;-webkit-appearance:none;background:rgba(43,255,136,.07);border:1px solid rgba(43,255,136,.24);border-radius:8px;color:var(--m);font:500 .74rem var(--mono);min-height:36px;padding:.4rem .75rem;cursor:pointer;flex:none;transition:color .2s,border-color .2s,background .2s}
.ph-skip:hover{color:var(--g);border-color:var(--g);background:rgba(43,255,136,.14)}

.ph-body{padding:1.3rem;font-family:var(--mono)}
.ph-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.45rem .8rem;font-size:.73rem;color:var(--m);padding-bottom:.85rem;margin-bottom:1rem;border-bottom:1px dashed rgba(124,58,237,.3)}
.ph-meta span b{color:#c4b5fd;font-weight:500}

.ph-lines{min-height:11.6rem;display:flex;flex-direction:column;gap:.5rem;font-size:clamp(.68rem,2.45vw,.92rem);line-height:1.55}
.ph-line{display:flex;align-items:baseline;gap:.5rem;color:var(--t)}
.ph-prompt{color:var(--g);font-weight:600;user-select:none;flex:none}
.ph-txt{flex:1;min-width:0;word-break:break-word}
.ph-ok{font-size:.72em;color:#c4b5fd;border:1px solid rgba(124,58,237,.35);background:rgba(124,58,237,.1);border-radius:4px;padding:.05rem .38rem;opacity:0;transition:opacity .2s;white-space:nowrap;flex:none}
.ph-line.done .ph-ok{opacity:1;color:var(--g);border-color:rgba(43,255,136,.3);background:rgba(43,255,136,.08)}
.ph-cur{display:inline-block;width:.52em;height:1.05em;background:var(--g);vertical-align:-.16em;margin-left:.18rem;box-shadow:0 0 10px var(--g);animation:phBlink .85s steps(1) infinite}
@keyframes phBlink{50%{opacity:0}}

.ph-prog-wrap{margin-top:1.15rem}
.ph-prog-top{display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:var(--m);margin-bottom:.45rem}
.ph-prog-top b{color:var(--g);font-weight:600;font-variant-numeric:tabular-nums}
.ph-track{height:7px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(43,255,136,.18);overflow:hidden}
.ph-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--p),var(--g));box-shadow:0 0 16px rgba(43,255,136,.55);transition:width .2s ease-out}

.ph-grant{opacity:0;max-height:0;overflow:hidden;border:0 solid rgba(43,255,136,.42);border-radius:12px;
background:linear-gradient(135deg,rgba(43,255,136,.11),rgba(124,58,237,.1));
box-shadow:0 0 28px rgba(43,255,136,.18);transition:opacity .4s ease,max-height .4s ease,padding .4s ease,margin .4s ease}
.ph-grant.show{opacity:1;max-height:220px;padding:1.05rem 1.15rem;margin-top:1.1rem;border-width:1px}
.ph-grant-status{font:600 clamp(.9rem,2.6vw,1.12rem)/1.2 var(--mono);letter-spacing:.08em;color:var(--g);text-shadow:0 0 16px rgba(43,255,136,.6)}
.ph-grant-welcome{margin-top:.45rem;font:500 clamp(.78rem,2.1vw,.94rem)/1.4 var(--mono);color:var(--t)}
.ph-grant-id{margin-top:.35rem;font:italic 800 clamp(1.12rem,3.6vw,1.5rem)/1.1 var(--disp);letter-spacing:.03em;text-transform:uppercase;color:#c4b5fd}
.ph-grant-id span{color:var(--g)}

.ph-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem;margin-top:1.15rem;padding-top:1rem;border-top:1px solid rgba(43,255,136,.14)}
.ph-hint{font-size:.72rem;color:var(--m)}
.ph-enter{appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:46px;padding:.72rem 1.35rem;border-radius:10px;border:1.5px solid var(--g);
background:rgba(43,255,136,.12);color:var(--g);font:600 .82rem var(--mono);letter-spacing:.05em;cursor:pointer;
transition:background .2s,color .2s,box-shadow .2s,transform .2s}
.ph-enter:hover,.ph-term.ready .ph-enter{background:var(--g);color:#03130a;box-shadow:0 0 26px rgba(43,255,136,.4)}
.ph-enter svg{width:1rem;height:1rem;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

@media (max-width:560px){
  .ph-head{padding:.75rem .9rem}
  .ph-badge{display:none}
  .ph-title{font-size:.74rem}
  .ph-body{padding:.95rem}
  .ph-lines{min-height:12.4rem}
  .ph-foot{flex-direction:column;align-items:stretch;gap:.65rem}
  .ph-hint{text-align:center}
  .ph-enter{width:100%}
}

/* nav */
.nav{position:fixed;inset:0 0 auto;height:var(--nav);z-index:50;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.nav.sc{background:rgba(4,8,6,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:var(--b)}
.nav-in{height:100%;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.logo{display:flex;align-items:center;gap:.7rem;font:700 1.25rem var(--body)}
.logo b{width:42px;height:42px;display:grid;place-items:center;border:1.5px solid var(--g);border-radius:12px;background:rgba(43,255,136,.07);color:var(--g);font:500 .85rem var(--mono);box-shadow:0 0 18px rgba(43,255,136,.2)}
.menu{display:flex;gap:.3rem;padding:.35rem;border:1px solid var(--b);border-radius:999px;background:rgba(9,18,13,.7)}
.menu a{padding:.5rem 1.15rem;border-radius:999px;color:var(--m);font:500 .9rem var(--mono);border:1px solid transparent;transition:color .2s,background .2s}
.menu a:hover{color:var(--t)}
.menu a.on{color:var(--g);background:rgba(43,255,136,.1);border-color:var(--b)}
.status{display:inline-flex;align-items:center;gap:.6rem;padding:.5rem 1.2rem;border:1px solid var(--b);border-radius:999px;font:500 .9rem var(--mono);color:var(--g);background:rgba(9,18,13,.7)}
.status i{width:10px;height:10px;border-radius:50%;background:var(--g);box-shadow:0 0 10px var(--g);animation:pl 2.4s infinite}
@keyframes pl{50%{opacity:.4}}
.burger{display:none;width:46px;height:46px;border:1px solid var(--b);border-radius:12px;background:var(--s);cursor:pointer;position:relative}
.burger span{position:absolute;left:12px;right:12px;height:2px;background:var(--g);border-radius:2px;transition:.25s}
.burger span:nth-child(1){top:16px}.burger span:nth-child(2){top:22px}.burger span:nth-child(3){top:28px}
.burger[aria-expanded=true] span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger[aria-expanded=true] span:nth-child(2){opacity:0}
.burger[aria-expanded=true] span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

/* hero */
.hero{min-height:100svh;display:flex;align-items:center;padding:calc(var(--nav) + 1.5rem) 0 4rem;position:relative}
.hero-in{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:2rem;align-items:center}
h1 .l{display:block;white-space:nowrap}
h1{font:italic 800 clamp(3.1rem,7.6vw,7rem)/.9 var(--disp);text-transform:uppercase;letter-spacing:-.01em}
h1 .gr{display:block;background:linear-gradient(180deg,#7CFFB2,var(--g) 45%,var(--g2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 22px rgba(43,255,136,.35))}
h1 em{font:500 .24em/1 var(--mono);font-style:normal;color:var(--g);vertical-align:middle;margin-left:.6em;-webkit-text-fill-color:var(--g)}
.sub{font:italic 700 clamp(1.35rem,2.6vw,2rem)/1.1 var(--disp);text-transform:uppercase;margin:1.6rem 0 1rem;letter-spacing:.01em}
.sub span{color:var(--g)}
.tag{color:var(--t);font-weight:500;max-width:34ch;margin-bottom:.4rem}
.intro{color:var(--m);margin-bottom:.3rem}
.meta{color:var(--m);font:400 .85rem var(--mono);margin-bottom:1.8rem}
.btns{display:flex;flex-wrap:wrap;gap:.8rem;margin-bottom:2.2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:50px;padding:.75rem 1.6rem;border-radius:12px;font-weight:600;border:1.5px solid var(--g);transition:transform .2s,box-shadow .2s,background .2s}
.btn.p{background:var(--g);color:#03130a}.btn.p:hover{box-shadow:0 8px 30px rgba(43,255,136,.35);transform:translateY(-2px)}
.btn.o{color:var(--g)}.btn.o:hover{background:rgba(43,255,136,.1);transform:translateY(-2px)}
.btn:active{transform:scale(.98)}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.feat li{min-width:0}
.feat .bx{width:46px;height:46px;display:grid;place-items:center;border:1px solid var(--b);border-radius:12px;background:rgba(43,255,136,.06);margin-bottom:.7rem}
.feat h3{font:700 .72rem var(--body);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.3rem}
.feat p{color:var(--m);font-size:.8rem;line-height:1.5}

/* visual */
.vis{position:relative;overflow-x:hidden;overflow-x:clip;min-width:0}
.stage{position:relative;width:640px;height:560px;container-type:inline-size;transform-origin:top left}
.win{border:1px solid var(--b);border-radius:12px;background:rgba(6,12,9,.92);box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 30px rgba(43,255,136,.06);overflow:hidden;font-size:11.5px}
.bar{display:flex;align-items:center;gap:.4em;padding:.7em 1em;border-bottom:1px solid var(--b);font:400 .95em var(--mono);color:var(--m)}
.bar i{width:.85em;height:.85em;border-radius:50%;background:#ff5f57}.bar i+i{background:#febc2e}.bar i+i+i{background:#28c840}
.bar span{margin-left:.6em}
.code{font:400 1em/1.7 var(--mono);white-space:pre;padding:1em 1.2em;overflow:hidden}
.k{color:var(--g)}.s{color:#7DD3FC}.c{color:#5b6e63}.w{color:var(--t)}
.lap{width:88%;margin:84px auto 0;transform:perspective(1500px) rotateY(-9deg) rotateX(3deg)}
.scr{container-type:inline-size;aspect-ratio:16/9;border:.9cqw solid #18221d;outline:1px solid var(--b);border-radius:1.6cqw;background:#040a07;box-shadow:0 0 6cqw rgba(43,255,136,.22);overflow:hidden;font-size:2.5cqw;padding:3cqw}
.mini{display:flex;justify-content:space-between;align-items:center;margin-bottom:4cqw;font:400 .72em var(--mono);color:var(--m)}
.mini b{color:var(--g)}.mini span{display:flex;gap:1.1em}
.mf{display:flex;flex-wrap:wrap;gap:1.6cqw;margin-top:3cqw}.mf span{font:400 .7em var(--mono);color:var(--g);border:1px solid var(--b);border-radius:.8cqw;padding:.3em .9em;background:rgba(43,255,136,.05)}
.mini .on{color:var(--g)}
.m2{display:grid;grid-template-columns:1fr 1.05fr;gap:3cqw}
.m2 .a{border:1px solid var(--b);border-radius:1.2cqw;padding:3cqw;background:rgba(43,255,136,.03)}
.m2 h4{margin:0 0 1.5cqw;font:700 1.7em/1.1 var(--body)}.m2 h4 s{display:block;text-decoration:none;color:var(--g)}
.m2 p{color:var(--m);font-size:.85em;line-height:1.5;margin-bottom:2.5cqw}
.m2 .bt{display:inline-block;border:1px solid var(--g);color:var(--g);border-radius:.8cqw;padding:.5em 1.1em;font:500 .8em var(--mono)}
.m2 .cd{border:1px solid rgba(124,58,237,.35);border-radius:1.2cqw;background:rgba(124,58,237,.07);padding:2.5cqw;font:400 .72em/1.6 var(--mono);white-space:pre;overflow:hidden}
.base{width:90%;margin:-.3cqw auto 0;height:3.2cqw;background:linear-gradient(#34413b,#0d1511);clip-path:polygon(0 0,100% 0,97% 100%,3% 100%);border-radius:0 0 2cqw 2cqw;position:relative}
.base::after{content:"";position:absolute;left:8%;right:8%;top:100%;height:3cqw;background:radial-gradient(ellipse at top,rgba(43,255,136,.5),transparent 70%);filter:blur(6px)}
.term{z-index:2;position:absolute;left:-1%;top:21%;width:37%;animation:fl 7s ease-in-out infinite}
.term .code{white-space:normal;line-height:1.9}.term p{opacity:0;animation:fi .5s forwards}
.term p:nth-child(2){animation-delay:.4s}.term p:nth-child(3){animation-delay:.9s}.term p:nth-child(4){animation-delay:1.3s}.term p:nth-child(5){animation-delay:1.8s}.term p:nth-child(6){animation-delay:2.2s}.term p:nth-child(7){animation-delay:2.6s}
@keyframes fi{to{opacity:1}}
.pill{display:inline-block;border:1px solid var(--b);border-radius:999px;padding:.25em 1em;margin-bottom:.8em;color:var(--g);background:rgba(43,255,136,.07)}
.abt{z-index:2;position:absolute;right:-1%;top:2%;width:39%;animation:fl 8s ease-in-out infinite reverse}
@keyframes fl{50%{transform:translateY(-8px)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.7em;padding:0 1em 1em}
.tiles div{border:1px solid var(--b);border-radius:.8em;padding:.7em;text-align:center;background:rgba(43,255,136,.04)}
.tiles b{display:block;color:var(--g);font:700 1.7em/1.1 var(--body)}.tiles span{color:var(--m);font-size:.85em}
.lets{white-space:nowrap;z-index:2;position:absolute;right:0;bottom:2%;display:flex;align-items:center;gap:1rem;padding:.9rem 1.4rem;border:1px solid var(--g);background:rgba(43,255,136,.06);font:italic 700 1.3rem/1 var(--disp);text-transform:uppercase;clip-path:polygon(0 0,100% 0,100% 70%,94% 100%,0 100%);transition:background .2s}
.lets:hover{background:rgba(43,255,136,.16)}.lets .ic{width:1.8rem;height:1.8rem}

/* sections */
.sec{padding:clamp(4rem,9vw,7rem) 0;position:relative}
.ttl{font:italic 800 clamp(2rem,5vw,3.3rem)/1 var(--disp);text-transform:uppercase;margin-bottom:2.5rem}
.ttl::before,.ttl::after{content:"</>";display:inline-block;font:500 .45em var(--mono);font-style:normal;color:var(--g);vertical-align:middle}
.ttl::before{margin-right:.7rem}.ttl::after{margin-left:.7rem}
.ttl span{color:var(--g)}
.about{display:grid;grid-template-columns:auto 1fr;gap:2.5rem;align-items:center}
.pf{width:180px;height:180px;border-radius:50%;object-fit:cover;object-position:center;border:2px solid var(--g);box-shadow:0 0 0 7px var(--bg),0 0 0 8px rgba(43,255,136,.3),0 0 40px rgba(43,255,136,.2);display:block}
.pfw{position:relative;width:180px;height:180px}
.pfw.no::after{content:"MH";position:absolute;inset:0;display:grid;place-items:center;border-radius:50%;border:2px solid var(--g);font:800 2.6rem var(--disp);color:var(--g)}
.card{background:linear-gradient(180deg,rgba(43,255,136,.045),transparent 50%),var(--s);border:1px solid var(--b);border-radius:18px;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);border-color:rgba(43,255,136,.5);box-shadow:0 16px 40px rgba(0,0,0,.45),0 0 26px rgba(43,255,136,.08)}
.abox{padding:1.8rem}.abox p{font-size:1.05rem;color:#cfdad4}
.chips{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1.4rem}
.chips li{padding:.35rem .95rem;border:1px solid var(--b);border-radius:999px;font:400 .82rem var(--mono);color:var(--g);background:rgba(43,255,136,.05)}
.grid{display:grid;gap:1.1rem}.grid>*{min-width:0}
.skills{grid-template-columns:repeat(4,1fr)}
.sk{padding:1.4rem;display:flex;flex-direction:column;gap:.9rem;min-height:150px}
.sk .bx{width:46px;height:46px;display:grid;place-items:center;border:1px solid var(--b);border-radius:12px;background:rgba(43,255,136,.06)}
.sk h3{font:600 1rem/1.3 var(--body)}
.lv{margin-top:auto;align-self:flex-start;font:400 .75rem var(--mono);color:var(--m);border:1px solid var(--b);border-radius:999px;padding:.1rem .7rem}
.projects{grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr}
.pj{display:flex;flex-direction:column;overflow:hidden}
.pb{padding:1.2rem 1.3rem .6rem}
.pt{aspect-ratio:16/9;margin:.85rem .85rem 0;border-radius:12px;overflow:hidden;border:1px solid var(--b);background:#050b08;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.pt svg,.pt img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.pt img.poster{object-fit:contain;background:#030c24}
.pt::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.07),transparent 35%),linear-gradient(0deg,rgba(4,8,6,.35),transparent 40%)}
